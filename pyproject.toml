[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-tui"
version = "1.4.0"
description = "Sudoku in your terminal: mouse, keyboard, notes, hints that explain, undo"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
sudoku = "sudoku_app.__main__:main"

[tool.setuptools.packages.find]
include = ["sudoku_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
